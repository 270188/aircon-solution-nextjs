<header class="header" [class.scrolled]="scrolled() || !onHome()" [class.hidden]="hidden()" [class.menu-open]="menuOpen()">
  <div class="container bar">
    <a href="/#inicio" class="logo" (click)="go('inicio', $event)" aria-label="AIRCONSOLUTION SERVICES SAC, ir al inicio">
      <img src="images/logo.jpg" alt="" width="44" height="44" class="logo-mark" />
      <span class="logo-words">
        <span class="logo-text"><span class="air">AIRCON</span><span class="con">SOLUTION</span></span>
        <span class="logo-sub">SERVICES SAC</span>
      </span>
    </a>

    <nav class="nav" aria-label="Principal">
      @for (link of links; track link.id) {
        <a [href]="'/#' + link.id" [class.active]="onHome() && active() === link.id" (click)="go(link.id, $event)">{{ link.label }}</a>
      }
    </nav>

    <div class="actions">
      <button class="icon-btn" type="button" (click)="toggleTheme($event)"
        [attr.aria-label]="ui.theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'">
        <span class="theme-icon" [class.dark]="ui.theme() === 'dark'">
          <app-icon name="sun" [size]="20" />
          <app-icon name="moon" [size]="20" />
        </span>
      </button>
      <a routerLink="/seguimiento" class="icon-btn track" aria-label="Seguir mi reserva" title="Seguir mi reserva">
        <app-icon name="ticket" [size]="20" />
      </a>
      <a href="/#reservar" class="btn btn-accent btn-sm cta" appMagnetic appRipple (click)="go('reservar', $event)">
        <app-icon name="calendar" [size]="18" /> Reservar cita
      </a>
      <button class="burger" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu" [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div id="mobile-menu" class="mobile" [class.open]="menuOpen()" [attr.aria-hidden]="!menuOpen()" [attr.inert]="menuOpen() ? null : ''">
  <nav aria-label="Menú móvil">
    @for (link of links; track link.id; let i = $index) {
      <a [href]="'/#' + link.id" [style.--i]="i" (click)="go(link.id, $event)">
        <span class="num">0{{ i + 1 }}</span>{{ link.label }}
      </a>
    }
    <a routerLink="/seguimiento" [style.--i]="links.length" (click)="closeMenu()">
      <span class="num">0{{ links.length + 1 }}</span>Seguir mi reserva
    </a>
  </nav>
  <div class="mobile-cta" [style.--i]="links.length + 1">
    <a href="/#reservar" class="btn btn-accent btn-block" (click)="go('reservar', $event)">Reservar cita</a>
    <a [href]="wa" target="_blank" rel="noopener" class="btn btn-whatsapp btn-block">
      <app-icon name="whatsapp" [size]="20" /> WhatsApp
    </a>
    <div class="social">
      <a [href]="facebook.href" [attr.target]="facebook.newTab ? '_blank' : null" rel="noopener" aria-label="Facebook"><app-icon name="facebook" [size]="20" /></a>
      <a [href]="business.instagram" target="_blank" rel="noopener" aria-label="Instagram"><app-icon name="instagram" [size]="20" /></a>
      <a [href]="tiktok.href" [attr.target]="tiktok.newTab ? '_blank' : null" rel="noopener" aria-label="TikTok"><app-icon name="tiktok" [size]="20" /></a>
    </div>
  </div>
</div>

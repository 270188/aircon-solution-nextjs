# Página web en Netlify (gratis, no se duerme). La API de reservas, contacto, panel y agenda corre en
# Netlify Functions con la base de datos Neon; cotizaciones y facturas siguen en Spring Boot (Render).

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# --- Backend: Netlify reenvía estas rutas al servidor (la dirección del navegador no cambia) ---
# Cotizaciones y facturación electrónica siguen en el servidor Spring Boot de Render.
[[redirects]]
  from = "/api/v1/admin/quotes/*"
  to = "https://airconsolution-ftc6.onrender.com/api/v1/admin/quotes/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/quotes"
  to = "https://airconsolution-ftc6.onrender.com/api/v1/admin/quotes"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/invoices/*"
  to = "https://airconsolution-ftc6.onrender.com/api/v1/admin/invoices/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/invoices"
  to = "https://airconsolution-ftc6.onrender.com/api/v1/admin/invoices"
  status = 200
  force = true

# Todo lo demás (reservas, contacto, boletín, panel y agenda) lo atiende la función de Netlify,
# siempre encendida, con la misma base de datos Neon (netlify/functions/api.mts).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/actuator/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

# --- Agenda interna de la empresa (citas, clientes, mantenimientos) ---
[[redirects]]
  from = "/agenda"
  to = "/admin"
  status = 302
  force = true

# --- Una sola dirección por página (las demás llevan a la limpia) ---
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# --- Cabeceras ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src https://maps.google.com https://www.google.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"

# El panel nunca aparece en Google.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Archivos con hash en el nombre: un año en caché.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

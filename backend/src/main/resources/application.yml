spring:
  application:
    name: airconsolution-api
  datasource:
    # Desarrollo: base de datos H2 en memoria. En producción usa el perfil "prod".
    url: jdbc:h2:mem:aircon;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    time-zone: America/Lima
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  booking:
    zone: America/Lima
    slots: 08:00,09:00,10:00,11:00,12:00,14:00,15:00,16:00,17:00
    capacity-per-slot: ${BOOKING_SLOT_CAPACITY:2}
    max-days-ahead: 60
    closed-days: SUNDAY
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:10}

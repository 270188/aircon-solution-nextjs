spring:
  application:
    name: airconsolution-api
  datasource:
    # Desarrollo: base de datos H2 en memoria. En producción usa el perfil "prod".
    url: jdbc:h2:mem:aircon;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    time-zone: America/Lima
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  booking:
    zone: America/Lima
    slots: 08:00,09:00,10:00,11:00,12:00,14:00,15:00,16:00,17:00
    capacity-per-slot: ${BOOKING_SLOT_CAPACITY:2}
    max-days-ahead: 60
    closed-days: SUNDAY
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:10}
  invoicing:
    ruc: ${INVOICE_RUC:20616633733}
    business-name: ${INVOICE_BUSINESS_NAME:AIRCONSOLUTION SERVICES SAC}
    address: ${INVOICE_ADDRESS:Calle 20 Mz. 28 Lt. 17 A.H. Laura Caller, Los Olivos, Lima}
    series-factura: ${INVOICE_SERIES_FACTURA:F001}
    series-boleta: ${INVOICE_SERIES_BOLETA:B001}
    # Si ya emitiste comprobantes con estas series en otro sistema, indica aquí el siguiente número.
    first-number-factura: ${INVOICE_FIRST_NUMBER_FACTURA:1}
    first-number-boleta: ${INVOICE_FIRST_NUMBER_BOLETA:1}
    # Ruta y token que entrega Nubefact. Si están vacíos, los comprobantes quedan como borrador.
    nubefact-url: ${NUBEFACT_URL:}
    nubefact-token: ${NUBEFACT_TOKEN:}

# Blueprint de Render: un servicio web gratis (Spring Boot + página Angular en la misma imagen).
# La base de datos PostgreSQL está en Neon (plan gratis, no expira). Sus datos se cargan
# como variables secretas al aprobar el blueprint.
services:
  - type: web
    name: airconsolution
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://airconsolutionsac.com,https://www.airconsolutionsac.com,https://*.onrender.com
